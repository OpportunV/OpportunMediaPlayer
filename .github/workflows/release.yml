name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for a manual test build (no tag is created, no release is published)"
        required: false
        default: "0.0.0-test"

jobs:
  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Pull Windows native libs
        run: git lfs pull --include="OMP.Lib/Libs/win/**"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Extract version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish win-x64
        run: dotnet publish OMP.Ui/OMP.Ui.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }} -o publish/win-x64

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path "publish/win-x64/*" -DestinationPath "OMP-${{ env.VERSION }}-win-x64-portable.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          iscc /DMyAppVersion=${{ env.VERSION }} /DSourceDir="${{ github.workspace }}\publish\win-x64" installer\windows\omp.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Verify installer was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "artifacts\OMP-Setup-${{ env.VERSION }}.exe")) {
            throw "Installer exe not found at artifacts\OMP-Setup-${{ env.VERSION }}.exe"
          }

      - name: Flatten installer output
        shell: pwsh
        run: |
          Move-Item "artifacts\OMP-Setup-${{ env.VERSION }}.exe" "OMP-Setup-${{ env.VERSION }}.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: |
            OMP-${{ env.VERSION }}-win-x64-portable.zip
            OMP-Setup-${{ env.VERSION }}.exe

  linux:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Pull Linux native libs
        run: git lfs pull --include="OMP.Lib/Libs/linux-x64/**"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish linux-x64
        run: dotnet publish OMP.Ui/OMP.Ui.csproj -c Release -r linux-x64 --self-contained true -p:Version=${{ env.VERSION }} -o publish/linux-x64

      - name: Create portable tarball
        run: tar -czf "OMP-${VERSION}-linux-x64-portable.tar.gz" -C publish/linux-x64 .

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp -r publish/linux-x64/* AppDir/usr/bin/
          cp installer/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/OMP
          cp installer/linux/omp.desktop AppDir/omp.desktop
          cp OMP.Ui/Assets/app-icon.png AppDir/omp.png

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "OMP-${VERSION}-x86_64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            OMP-${{ env.VERSION }}-linux-x64-portable.tar.gz
            OMP-${{ env.VERSION }}-x86_64.AppImage

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Extract version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish osx-x64
        run: dotnet publish OMP.Ui/OMP.Ui.csproj -c Release -r osx-x64 --self-contained true -p:Version=${{ env.VERSION }} -o publish/osx-x64

      - name: Publish osx-arm64
        run: dotnet publish OMP.Ui/OMP.Ui.csproj -c Release -r osx-arm64 --self-contained true -p:Version=${{ env.VERSION }} -o publish/osx-arm64

      - name: Build .app bundles, ad-hoc sign, package as .dmg
        run: |
          for rid in osx-x64 osx-arm64; do
            APP="OMP.app"
            rm -rf "$APP"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

            cp -R "publish/$rid/." "$APP/Contents/MacOS/"
            chmod +x "$APP/Contents/MacOS/OMP"

            sed "s/{{VERSION}}/${VERSION}/g" installer/macos/Info.plist > "$APP/Contents/Info.plist"

            ICONSET="app-icon.iconset"
            rm -rf "$ICONSET"
            mkdir "$ICONSET"
            for size in 16 32 128 256 512; do
              sips -z "$size" "$size" OMP.Ui/Assets/app-icon.png --out "$ICONSET/icon_${size}x${size}.png" > /dev/null
              double=$((size * 2))
              sips -z "$double" "$double" OMP.Ui/Assets/app-icon.png --out "$ICONSET/icon_${size}x${size}@2x.png" > /dev/null
            done
            iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/app-icon.icns"
            rm -rf "$ICONSET"

            codesign --force --deep --sign - "$APP"

            DMG_ROOT="dmg-root"
            rm -rf "$DMG_ROOT"
            mkdir "$DMG_ROOT"
            cp -R "$APP" "$DMG_ROOT/"
            ln -s /Applications "$DMG_ROOT/Applications"

            hdiutil create -volname "Opportun Media Player" -srcfolder "$DMG_ROOT" -ov -format UDZO "OMP-${VERSION}-${rid}.dmg"

            rm -rf "$APP" "$DMG_ROOT"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: |
            OMP-${{ env.VERSION }}-osx-x64.dmg
            OMP-${{ env.VERSION }}-osx-arm64.dmg

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          files: dist/**/*
          draft: true
