name: CI

on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!.github/images/**'
              - '!**/*.md'

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Pull Windows native libs
        if: runner.os == 'Windows'
        run: git lfs pull --include="OMP.Lib/Libs/win/**"

      - name: Pull Linux native libs
        if: runner.os == 'Linux'
        run: git lfs pull --include="OMP.Lib/Libs/linux-x64/**"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build OMP.Ui/OMP.Ui.csproj -c Release

      - name: Test OMP.Ui
        run: dotnet test OMP.Ui.Tests/OMP.Ui.Tests.csproj -c Release

      - name: Test
        run: dotnet test OMP.Lib.Tests/OMP.Lib.Tests.csproj -c Release

  integration-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Pull Windows native libs
        if: matrix.rid == 'win-x64'
        run: git lfs pull --include="OMP.Lib/Libs/win/**"

      - name: Pull Linux native libs
        if: matrix.rid == 'linux-x64'
        run: git lfs pull --include="OMP.Lib/Libs/linux-x64/**"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install FFmpeg (macOS only)
        if: runner.os == 'macOS'
        run: brew install ffmpeg@7

      - name: Test
        id: test
        continue-on-error: true
        env:
          DOTNET_DbgEnableMiniDump: "1"
          DOTNET_DbgMiniDumpType: "4"
          DOTNET_DbgMiniDumpName: "${{ github.workspace }}/crash_%p.dmp"
        run: dotnet test OMP.Lib.IntegrationTests/OMP.Lib.IntegrationTests.csproj -c Release -r ${{ matrix.rid }}

      - name: Upload crash dump
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: crash-dump-${{ matrix.rid }}
          path: ${{ github.workspace }}/crash_*.dmp
          if-no-files-found: ignore

      - name: Fail job if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1
